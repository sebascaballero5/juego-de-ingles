<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Passive Voice Match</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --primary: #4361ee;
            --primary-hover: #3a0ca3;
            --secondary: #f72585;
            --success: #06d6a0;
            --error: #ef476f;
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            background-color: var(--container-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 900px;
            width: 95%;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--secondary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.instructions {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #a9b0c0;
        }

        .board {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .column-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .card {
            background: linear-gradient(135deg, #4361ee 0%, #3f37c9 100%);
            border: 2px solid transparent;
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            user-select: none;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.5);
        }

        .card.selected {
            border-color: var(--secondary);
            background: linear-gradient(135deg, #f72585 0%, #b5179e 100%);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(247, 37, 133, 0.6);
        }

        .card.matched {
            background: linear-gradient(135deg, var(--success) 0%, #04b285 100%);
            color: #000;
            pointer-events: none;
            opacity: 0.8;
            transform: scale(0.95);
        }

        .card.wrong {
            background: linear-gradient(135deg, var(--error) 0%, #d90429 100%);
            animation: shake 0.4s ease;
        }

        /* Modal de Felicitación */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(76, 201, 240, 0.4);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .modal-content p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #e0fbfc;
        }

        .btn-restart {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
        }

        .btn-restart:hover {
            background-color: #b5179e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(247, 37, 133, 0.6);
        }

        /* Animación para error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Responsividad */
        @media (max-width: 768px) {
            .board { flex-direction: column; }
            .card { font-size: 1rem; padding: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>The Passive Voice</h1>
        <p class="instructions">Conecta la oración en <strong>Active Voice</strong> con su equivalente en <strong>Passive Voice</strong>.</p>
        
        <div class="board">
            <div class="column">
                <div class="column-title">Active Voice</div>
                <div id="active-list"></div>
            </div>
            <div class="column">
                <div class="column-title">Passive Voice</div>
                <div id="passive-list"></div>
            </div>
        </div>

        <!-- Modal de Victoria -->
        <div class="modal-overlay" id="win-modal">
            <div class="modal-content">
                <h2>¡Brillante! 🎉</h2>
                <p>Has dominado el uso de la Voz Pasiva.</p>
                <button class="btn-restart" onclick="initGame()">Jugar de Nuevo</button>
            </div>
        </div>
    </div>

    <script>
        // Base de datos de conceptos (Educativa y clara)
        const grammarPairs = [
            { id: 1, active: "Shakespeare wrote Hamlet", passive: "Hamlet was written by Shakespeare" },
            { id: 2, active: "They are building a new hospital", passive: "A new hospital is being built" },
            { id: 3, active: "The dog chased the cat", passive: "The cat was chased by the dog" },
            { id: 4, active: "She will sing a beautiful song", passive: "A beautiful song will be sung by her" },
            { id: 5, active: "Someone has stolen my keys", passive: "My keys have been stolen" }
        ];

        let selectedActive = null;
        let selectedPassive = null;
        let matchedPairs = 0;

        // Utilidad para desordenar arrays (Algoritmo de Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Inicializar el juego
        function initGame() {
            const activeList = document.getElementById('active-list');
            const passiveList = document.getElementById('passive-list');
            const modal = document.getElementById('win-modal');
            
            // Reiniciar estado
            activeList.innerHTML = '';
            passiveList.innerHTML = '';
            modal.classList.remove('active');
            selectedActive = null;
            selectedPassive = null;
            matchedPairs = 0;

            // Crear arrays separados y mezclados
            let actives = shuffle([...grammarPairs]);
            let passives = shuffle([...grammarPairs]);

            // Renderizar cartas Activas
            actives.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.textContent = item.active;
                div.dataset.id = item.id;
                div.dataset.type = 'active';
                div.onclick = () => handleCardClick(div);
                activeList.appendChild(div);
            });

            // Renderizar cartas Pasivas
            passives.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.textContent = item.passive;
                div.dataset.id = item.id;
                div.dataset.type = 'passive';
                div.onclick = () => handleCardClick(div);
                passiveList.appendChild(div);
            });
        }

        // Lógica de interacción
        function handleCardClick(card) {
            if (card.classList.contains('matched') || card.classList.contains('selected')) return;

            // Seleccionar carta según su tipo
            if (card.dataset.type === 'active') {
                if (selectedActive) selectedActive.classList.remove('selected');
                selectedActive = card;
            } else {
                if (selectedPassive) selectedPassive.classList.remove('selected');
                selectedPassive = card;
            }

            card.classList.add('selected');

            // Si hay dos cartas seleccionadas, verificar si coinciden
            if (selectedActive && selectedPassive) {
                checkMatch();
            }
        }

        function checkMatch() {
            const activeId = selectedActive.dataset.id;
            const passiveId = selectedPassive.dataset.id;
            const activeCard = selectedActive;
            const passiveCard = selectedPassive;

            // Bloquear temporalmente la selección extra
            document.body.style.pointerEvents = 'none';

            if (activeId === passiveId) {
                // Éxito
                setTimeout(() => {
                    activeCard.classList.replace('selected', 'matched');
                    passiveCard.classList.replace('selected', 'matched');
                    matchedPairs++;
                    resetSelection();
                    
                    if (matchedPairs === grammarPairs.length) {
                        setTimeout(showWinScreen, 500);
                    }
                }, 400);
            } else {
                // Error
                setTimeout(() => {
                    activeCard.classList.add('wrong');
                    passiveCard.classList.add('wrong');
                    
                    setTimeout(() => {
                        activeCard.classList.remove('selected', 'wrong');
                        passiveCard.classList.remove('selected', 'wrong');
                        resetSelection();
                    }, 500);
                }, 300);
            }
        }

        function resetSelection() {
            selectedActive = null;
            selectedPassive = null;
            document.body.style.pointerEvents = 'all';
        }

        function showWinScreen() {
            const modal = document.getElementById('win-modal');
            modal.classList.add('active');
        }

        // Arrancar el juego al cargar
        window.onload = initGame;
    </script>
</body>
</html>
